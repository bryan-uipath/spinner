<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stand-up Roulette</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* Palette sourced from UiPath Apollo "dark" theme tokens (apollo-ui/apollo-core). */
  :root {
    --bg: #182027;               /* --color-background */
    --panel: #273139;            /* --color-background-raised */
    --border: #526069;           /* --color-border-de-emp */
    --text: #f4f5f7;             /* --color-foreground */
    --muted: #a4b1b8;            /* --color-foreground-light */
    --accent: #ff8f70;           /* --color-foreground-highlight */
    --accent2: #66adff;          /* --color-primary */
    /* Apollo elevation shadow tokens */
    --shadow-dp-2: 0px 1px 5px 0px rgba(0, 0, 0, 0.2), 0px 2px 2px 0px rgba(0, 0, 0, 0.14), 0px 3px 1px -2px rgba(0, 0, 0, 0.12);
    --shadow-dp-6: 0px 3px 5px -1px rgba(0, 0, 0, 0.2), 0px 6px 10px 0px rgba(0, 0, 0, 0.14), 0px 1px 18px 0px rgba(0, 0, 0, 0.12);
    --shadow-dp-16: 0px 8px 10px -5px rgba(0, 0, 0, 0.2), 0px 16px 24px 2px rgba(0, 0, 0, 0.14), 0px 6px 30px 5px rgba(0, 0, 0, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .stage {
    position: relative;
    width: min(420px, 88vw);
    height: min(420px, 88vw);
    margin-bottom: 12px;
  }
  canvas {
    width: 100%; height: 100%; display: block;
    border-radius: 50%;
    box-shadow: var(--shadow-dp-16);
  }
  .pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 24px solid var(--accent);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    z-index: 2;
  }
  .hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--panel);
    border: 3px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    color: var(--text);
    user-select: none;
    transition: transform 0.1s ease;
    box-shadow: var(--shadow-dp-6);
  }
  .hub:hover { transform: translate(-50%, -50%) scale(1.06); }
  .hub:active { transform: translate(-50%, -50%) scale(0.96); }
  .hub.disabled { opacity: 0.5; cursor: default; }

  .result {
    min-height: 44px;
    font-size: 24px;
    font-weight: 700;
    margin: 8px 0 20px;
    min-height: 30px;
    text-align: center;
  }
  .result .name { color: var(--accent); }

  .controls {
    width: min(420px, 88vw);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow-dp-2);
    margin-top: 12px;
  }
  .controls summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .controls summary::-webkit-details-marker { display: none; }
  .controls summary::after { content: "▸"; transition: transform 0.15s; }
  .controls[open] summary::after { transform: rotate(90deg); }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  textarea {
    width: 100%;
    min-height: 140px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px;
    resize: vertical;
    line-height: 1.6;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button.btn {
    background: var(--accent2);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-dp-2);
  }
  button.btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); box-shadow: none; }
  button.btn:active { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: default; }
  .confirmation { margin-bottom: 12px; text-align: center; }
  .confirmation p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .slice-tooltip {
    position: absolute;
    z-index: 3;
    pointer-events: none;
    max-width: calc(100% - 16px);
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow-dp-6);
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-line;
    overflow-wrap: anywhere;
  }
  .saved { font-size: 12px; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
  <h1>🎯 Stand-up Roulette</h1>
  <div class="subtitle">Spin to pick who runs scrum.</div>

  <div class="stage">
    <div class="pointer"></div>
    <canvas id="wheel" width="800" height="800" role="img"></canvas>
    <div class="hub" id="spinBtn">SPIN</div>
    <div class="slice-tooltip" id="sliceTooltip" role="tooltip" hidden></div>
  </div>

  <div class="result" id="result" aria-live="polite"></div>
  <div class="confirmation">
    <button class="btn" id="confirmBtn" hidden>Confirm</button>
    <p id="confirmMsg" aria-live="polite"></p>
  </div>

  <details class="controls" id="controls">
    <summary>Configure names</summary>
    <label for="names">One name per line</label>
    <textarea id="names" spellcheck="false"></textarea>
    <div class="row">
      <button class="btn" id="saveBtn">Save</button>
      <button class="btn secondary" id="resetBtn">Reset to defaults</button>
      <span class="saved" id="savedMsg"></span>
    </div>
  </details>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "standup-roulette-names";
  const COUNTS_KEY = "standup-roulette-counts";
  const DEFAULT_NAMES = ["Alice", "Bob", "Carol", "Dave", "Erin", "Frank"];
  // Apollo dark-theme chart palette (--color-primary, highlight, chart-*).
  const COLORS = ["#66adff", "#ff8f70", "#74c94b", "#ffbb27", "#b748b6", "#44cffc", "#f25a8c", "#42a1ff"];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spinBtn");
  const resultEl = document.getElementById("result");
  const confirmBtn = document.getElementById("confirmBtn");
  const confirmMsg = document.getElementById("confirmMsg");
  const sliceTooltip = document.getElementById("sliceTooltip");
  const namesInput = document.getElementById("names");
  const saveBtn = document.getElementById("saveBtn");
  const resetBtn = document.getElementById("resetBtn");
  const savedMsg = document.getElementById("savedMsg");

  let names = loadNames();
  const counts = loadCounts();
  let pendingWinner = null;
  let wheel = [];          // everyone in the configured name list
  let slices = [];
  let rotation = 0;        // current wheel rotation in radians
  let spinning = false;

  // ----- persistence -----
  function loadNames() {
    try {
      const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (Array.isArray(stored)) {
        const list = [...new Set(stored.filter(n => typeof n === "string").map(n => n.trim()).filter(Boolean))];
        if (list.length) return list;
      }
    } catch (e) { /* fall through */ }
    return DEFAULT_NAMES.slice();
  }
  function saveNames(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) { /* ignore */ }
  }
  function loadCounts() {
    const valid = Object.create(null);
    try {
      const stored = JSON.parse(localStorage.getItem(COUNTS_KEY));
      if (stored && typeof stored === "object" && !Array.isArray(stored)) {
        for (const [name, count] of Object.entries(stored)) {
          if (Number.isSafeInteger(count) && count >= 0) valid[name] = count;
        }
      }
    } catch (e) { /* start with zero counts */ }
    return valid;
  }
  function refreshWheel() {
    hideTooltip();
    wheel = names.slice();
    // Every two turns above the minimum halves a person's weight.
    // Subtracting the minimum keeps the odds independent of lifetime totals.
    const fewestTurns = wheel.reduce((minimum, name) => Math.min(minimum, counts[name] || 0), Infinity);
    const weights = wheel.map(name => 2 ** (-((counts[name] || 0) - fewestTurns) / 2));
    const total = weights.reduce((sum, weight) => sum + weight, 0);
    let angle = 0;
    slices = wheel.map((name, i) => {
      const start = angle;
      angle += weights[i] / total * Math.PI * 2;
      return { name, start, end: i === wheel.length - 1 ? Math.PI * 2 : angle };
    });
    canvas.setAttribute("aria-label", "Spinner. " + slices.map(slice => slice.name + ": " + turnCount(slice.name) + ", " + landingChance(slice) + " chance of landing").join(". "));
  }
  function parseInput() {
    return [...new Set(namesInput.value.split("\n").map(s => s.trim()).filter(Boolean))];
  }
  function turnCount(name) {
    const count = counts[name] || 0;
    return count + (count === 1 ? " turn" : " turns");
  }
  function landingChance(slice) {
    const percent = (slice.end - slice.start) / (Math.PI * 2) * 100;
    return (percent < 0.1 ? "<0.1" : Number(percent.toFixed(1))) + "%";
  }
  function hideTooltip() {
    sliceTooltip.hidden = true;
  }
  function showTooltip(event) {
    if (spinning) return;
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width * canvas.width - canvas.width / 2;
    const y = (event.clientY - rect.top) / rect.height * canvas.height - canvas.height / 2;
    const distance = Math.hypot(x, y);
    if (distance > canvas.width / 2 - 10 || distance < 36 / rect.width * canvas.width) {
      hideTooltip();
      return;
    }
    const fullTurn = Math.PI * 2;
    const angle = ((Math.atan2(y, x) - rotation) % fullTurn + fullTurn) % fullTurn;
    const slice = slices.find(slice => angle >= slice.start && angle < slice.end);
    if (!slice) { hideTooltip(); return; }
    sliceTooltip.textContent = slice.name + "\n" + turnCount(slice.name) + "\n" + landingChance(slice) + " chance of landing";
    sliceTooltip.hidden = false;
    sliceTooltip.style.left = Math.max(8, Math.min(event.clientX - rect.left + 12, rect.width - sliceTooltip.offsetWidth - 8)) + "px";
    sliceTooltip.style.top = Math.max(8, Math.min(event.clientY - rect.top + 12, rect.height - sliceTooltip.offsetHeight - 8)) + "px";
  }
  function clearPending() {
    hideTooltip();
    pendingWinner = null;
    confirmBtn.hidden = true;
    confirmMsg.textContent = "";
    resultEl.innerHTML = "";
  }
  function setSpinning(active) {
    spinning = active;
    saveBtn.disabled = active;
    resetBtn.disabled = active;
    spinBtn.classList[active ? "add" : "remove"]("disabled");
    spinBtn.textContent = active ? "…" : "SPIN";
  }
  function flashSaved(text) {
    savedMsg.textContent = text;
    setTimeout(() => { savedMsg.textContent = ""; }, 1800);
  }

  // ----- drawing -----
  function draw() {
    const size = canvas.width;
    const cx = size / 2, cy = size / 2, r = size / 2 - 10;
    ctx.clearRect(0, 0, size, size);

    if (wheel.length === 0) {
      ctx.fillStyle = "#273139";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#a4b1b8";
      ctx.font = "28px -apple-system, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("Add some names →", cx, cy);
      return;
    }

    for (let i = 0; i < wheel.length; i++) {
      const slice = slices[i];
      const start = rotation + slice.start;
      const end = rotation + slice.end;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.strokeStyle = "rgba(24,32,39,0.6)";
      ctx.lineWidth = 3;
      ctx.stroke();

      // label
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((start + end) / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + Math.max(18, Math.min(34, 320 / wheel.length + 14)) + "px -apple-system, sans-serif";
      const label = wheel[i].length > 16 ? wheel[i].slice(0, 15) + "…" : wheel[i];
      ctx.fillText(label, r - 24, 0);
      ctx.restore();
    }

    // outer rim
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = "#526069";
    ctx.lineWidth = 8;
    ctx.stroke();
  }

  // ----- spinning -----
  // The pointer sits at the top (12 o'clock = -PI/2). The winning segment is
  // whichever one is under the pointer when the wheel stops.
  function spin() {
    if (spinning) return;
    refreshWheel();
    if (wheel.length === 0) return;
    clearPending();
    setSpinning(true);

    const pick = Math.random() * Math.PI * 2;
    const winner = slices.findIndex(slice => pick < slice.end);
    const selected = slices[winner];

    // Target rotation so the winner's segment center lands under the top pointer.
    // Solve R so that the slice center is at -PI/2, plus several full turns.
    const turns = 5 + Math.floor(Math.random() * 3);
    const targetMod = (-Math.PI / 2) - (selected.start + selected.end) / 2;
    const current = rotation % (Math.PI * 2);
    let delta = (targetMod - current) % (Math.PI * 2);
    if (delta < 0) delta += Math.PI * 2;
    const totalDelta = turns * Math.PI * 2 + delta;

    const startRotation = rotation;
    const duration = 4200;
    let startTime = null;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    function frame(ts) {
      if (startTime === null) startTime = ts;
      const elapsed = ts - startTime;
      const t = Math.min(elapsed / duration, 1);
      rotation = startRotation + totalDelta * easeOutCubic(t);
      draw();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        rotation = startRotation + totalDelta;
        draw();
        finishSpin(winner);
      }
    }
    requestAnimationFrame(frame);
  }

  function finishSpin(winnerIndex) {
    const winnerName = wheel[winnerIndex];
    pendingWinner = winnerName;
    resultEl.innerHTML = '👉 <span class="name">' + escapeHtml(winnerName) + '</span>';
    setSpinning(false);
    confirmBtn.hidden = false;
    confirmMsg.textContent = "Confirm this turn, or spin again to pick someone else.";
  }

  function confirmWinner() {
    if (spinning || pendingWinner === null) return;
    const winnerName = pendingWinner;
    pendingWinner = null;
    counts[winnerName] = (counts[winnerName] || 0) + 1;
    let persisted = true;
    try {
      localStorage.setItem(COUNTS_KEY, JSON.stringify(counts));
    } catch (e) { persisted = false; }
    confirmBtn.hidden = true;
    confirmMsg.textContent = persisted ? "Confirmed ✓" : "Confirmed for this session. Browser storage is unavailable.";

    refreshWheel();
    // Keep the confirmed person under the pointer as the slice sizes change.
    const confirmedSlice = slices.find(slice => slice.name === winnerName);
    rotation = confirmedSlice
      ? -Math.PI / 2 - (confirmedSlice.start + confirmedSlice.end) / 2
      : rotation % (Math.PI * 2);
    draw();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ----- events -----
  spinBtn.addEventListener("click", spin);
  confirmBtn.addEventListener("click", confirmWinner);
  canvas.addEventListener("pointermove", showTooltip);
  canvas.addEventListener("pointerdown", showTooltip);
  canvas.addEventListener("pointerleave", hideTooltip);

  saveBtn.addEventListener("click", () => {
    if (spinning) return;
    const list = parseInput();
    if (!list.length) { flashSaved("Need at least one name"); return; }
    names = list;
    namesInput.value = names.join("\n");
    saveNames(names);
    clearPending();
    refreshWheel();
    rotation = 0;
    draw();
    flashSaved("Saved ✓");
  });

  resetBtn.addEventListener("click", () => {
    if (spinning) return;
    names = DEFAULT_NAMES.slice();
    namesInput.value = names.join("\n");
    saveNames(names);
    clearPending();
    refreshWheel();
    rotation = 0;
    draw();
    flashSaved("Reset ✓");
  });

  // ----- init -----
  namesInput.value = names.join("\n");
  refreshWheel();
  draw();
})();
</script>
</body>
</html>
